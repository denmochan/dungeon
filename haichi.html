<script>const NAMES25={"bat": "None", "rat": "None", "imp": "None", "ghost": "None", "slime": "None", "eye": "None", "goblin": "None", "spider": "None", "myconid": "None", "kobold": "None", "wolf": "None", "skeleton": "None", "salamander": "None", "mimic": "None", "orc": "None", "gargoyle": "None", "eyebat": "★ None", "firebat": "★ None", "nightspider": "★ None", "sporerat": "★ None", "shaman": "★ None", "eyespider": "★ None", "sapper": "★ None", "sporewraith": "★ None", "ratking": "★ None", "webgoblin": "★ None", "nightwolf": "★ None", "lich": "★ None", "vampire": "★ None", "wraitheye": "★ None", "goldkobold": "★ None", "wolfrider": "★ None", "ghostslime": "★ None", "jackal": "★ None", "fungus": "★ None", "emberskel": "★ None", "ogremage": "★ None", "hauntchest": "★ None", "ifrit": "★ None", "slimeknight": "★ None", "rotslime": "★ None", "ghoul": "★ None", "stoneeye": "★ None", "bogtroll": "★ None", "berserker": "★ None", "stonespider": "★ None", "chimera": "★ None", "bonewarden": "★ None", "minerorc": "★ None", "golem": "★ None", "gemeater": "★★ None", "lavaslime": "★★ None", "mindlord": "★★ None", "underlord": "★★ None", "count": "★★ None", "rotlord": "★★ None", "bonedragon": "★★ None", "dragon": "★★ None", "vaultkeeper": "★★ None", "flamechimera": "★★ None", "fortgolem": "★★ None", "maou": "★★★ None", "elderdragon": "★★★ None", "lord": "主", "warrior": "勇者・戦士", "knight": "勇者・騎士", "mage": "勇者・魔法使い", "priest": "勇者・僧侶", "thief": "勇者・盗賊", "hunter": "勇者・狩人"};
// ================= 粘土フィギュア：形を「距離の式」で作り、境目をとかしてつなぐ（光で描く） =================
// 顔は今のドット絵から切り抜いて正面に貼る。影・すき間の暗さ（AO）も光の計算で出す
const SDF_VS = `attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}`;
const SDF_FS = `precision highp float;
uniform vec2 res;uniform vec3 J[40];uniform mat3 HR;uniform mat3 TR;uniform vec3 cam;uniform mat3 camM;uniform float fl;
uniform sampler2D face;uniform float hasFace;uniform vec3 skin;uniform vec3 cloth;uniform vec4 deb[6];uniform float tool;uniform float squash;uniform vec3 bgc;uniform float clr;
float hash(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){return vnoise(p)*0.55+vnoise(p*2.1)*0.28+vnoise(p*4.3)*0.17;}
float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}
float sEll(vec3 p,vec3 r){float k0=length(p/r),k1=length(p/(r*r));return k0*(k0-1.0)/k1;}
float sTap(vec3 p,vec3 a,vec3 b,float ra,float rb){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-mix(ra,rb,h);}
float sRBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-r;}
float sOBox(vec3 p,vec3 a,vec3 b,vec3 sd,vec2 hw){vec3 u=b-a;float L=length(u);u/=L;vec3 v=normalize(sd-u*dot(sd,u));vec3 w=cross(u,v);vec3 q=p-a;
 vec3 l=vec3(dot(q,v),dot(q,u)-L*0.5,dot(q,w));vec3 d=abs(l)-vec3(hw.x,L*0.5,hw.y);return length(max(d,0.0))+min(max(d.x,max(d.y,d.z)),0.0);}
// 頭（頭の中心から見た位置）
float sHead(vec3 h){
 vec3 q=h;q.x*=1.0+q.y*0.10;                      // 下（あご）を少し広く
 float d=mix(sRBox(q,vec3(0.39,0.41,0.33),0.27),sEll(q,vec3(0.42,0.44,0.37)),0.62);
 for(int s=0;s<2;s++){float sg=s==0?-1.0:1.0;vec3 e=vec3(h.x*sg,h.y,h.z);
  d=smin(d,sEll(e-vec3(0.17,0.15,0.29),vec3(0.14,0.055,0.07)),0.06);
  d=smin(d,sEll(e-vec3(0.22,-0.12,0.24),vec3(0.13,0.1,0.1)),0.08);
  vec3 ep=e;ep.z=(ep.z+0.04)*2.4;float ear=sTap(ep,vec3(0.32,0.04,-0.05),vec3(0.84,0.24,-0.26),0.15,0.014)/2.0;
  vec3 ip=e-vec3(0.0,0.0,0.035);ip.z=(ip.z+0.04)*2.4;float inr=sTap(ip,vec3(0.42,0.07,-0.05),vec3(0.78,0.23,-0.26),0.085,0.008)/2.0;
  ear=max(ear,-inr);d=smin(d,ear,0.05);}
 return d;}
// 指つきの手（i=手首の番号）
float sHand(vec3 p,int side){vec3 w=side==0?J[5]:J[8];float d=sEll(p-w,vec3(0.135,0.12,0.13));
 for(int f=0;f<4;f++){vec3 a,b;if(side==0){a=J[17+f*2];b=J[18+f*2];}else{a=J[25+f*2];b=J[26+f*2];}d=smin(d,sTap(p,a,b,0.05,0.042),0.03);}return d;}
// 体だけ（材料番号つき）。m: 1肌 2つめ 3腰布 4木 5鉄 6血
vec2 body(vec3 p){
 vec3 tp=TR*(p-J[0]);                                     // 胴の向き
 float d=sEll(tp-vec3(0.0,0.28,0.02),vec3(0.32,0.24,0.24));
 d=smin(d,sEll(tp-vec3(0.0,0.10,0.04),vec3(0.30,0.2,0.25)),0.10);
 d=smin(d,sTap(p,J[1],J[2]-vec3(0.0,0.2,0.0),0.16,0.17),0.08);    // 首
 d=smin(d,sHead(HR*(p-J[2])),0.07);
 d=smin(d,sTap(p,J[3],J[4],0.12,0.10),0.08);d=smin(d,sTap(p,J[4],J[5],0.10,0.115),0.05);
 d=smin(d,sTap(p,J[6],J[7],0.12,0.10),0.08);d=smin(d,sTap(p,J[7],J[8],0.10,0.115),0.05);
 d=smin(d,sHand(p,0),0.05);d=smin(d,sHand(p,1),0.05);
 d=smin(d,sTap(p,J[9],J[10],0.15,0.11),0.09);d=smin(d,sTap(p,J[10],J[11],0.11,0.10),0.06);
 d=smin(d,sTap(p,J[12],J[13],0.15,0.11),0.09);d=smin(d,sTap(p,J[13],J[14],0.11,0.10),0.06);
 vec3 fL=J[11]+(J[15]-J[11])*0.45;fL.y=0.065;vec3 fR=J[14]+(J[16]-J[14])*0.45;fR.y=0.065;
 d=smin(d,sTap(p,vec3(J[11].x,0.07,J[11].z),fL+(J[15]-J[11])*0.25,0.10,0.085)-0.005,0.06);
 d=smin(d,sTap(p,vec3(J[14].x,0.07,J[14].z),fR+(J[16]-J[14])*0.25,0.10,0.085)-0.005,0.06);
 vec2 r=vec2(d,1.0);
 // つめ・足の指
 float c=1e3;
 for(int f=0;f<4;f++){c=min(c,sTap(p,J[18+f*2]-(J[18+f*2]-J[17+f*2])*0.15,J[18+f*2]+(J[18+f*2]-J[17+f*2])*0.35,0.03,0.012));c=min(c,sTap(p,J[26+f*2]-(J[26+f*2]-J[25+f*2])*0.15,J[26+f*2]+(J[26+f*2]-J[25+f*2])*0.35,0.03,0.012));}
 for(int s=0;s<2;s++){vec3 a=s==0?J[11]:J[14];vec3 t=s==0?J[15]:J[16];vec3 fw=normalize(vec3(t.x-a.x,0.0,t.z-a.z));vec3 sd=vec3(fw.z,0.0,-fw.x);
  for(int k=0;k<3;k++){float o=float(k)-1.0;vec3 q=vec3(t.x,0.045,t.z)+sd*o*0.07-fw*abs(o)*0.025;c=min(c,sEll(p-q,vec3(0.045,0.04,0.05)));}}
 if(c<r.x)r=vec2(c,2.0);
 // 腰布：腰まわりの筒、下のふちをギザギザに
 {vec3 q=tp;float ang=atan(q.x,q.z);float rx=0.335-q.y*0.10,rz=0.29-q.y*0.10;
  float ring=abs((length(q.xz/vec2(rx,rz))-1.0)*min(rx,rz))-0.022;
  float bot=-0.17+0.045*sin(ang*9.0)+0.025*sin(ang*23.0+1.0)+0.02*sin(ang*41.0);
  float cl=max(ring,max(q.y-0.10,bot-q.y));if(cl<r.x)r=vec2(cl,3.0);}
 // 道具
 if(tool>0.5&&tool<1.5){float h=sTap(p,J[33],J[34],0.035,0.035);if(h<r.x)r=vec2(h,4.0);
  float b=sOBox(p,J[34],J[35],J[36],vec2(0.07,0.012))-0.004;if(b<r.x)r=vec2(b,5.0);}
 if(tool>2.5){float bo=sEll(p-J[34],vec3(0.3,0.26,0.28))+(vnoise(p*8.0)-0.5)*0.05;if(bo<r.x)r=vec2(bo,7.0);}
 if(tool>1.5&&tool<2.5){float h=sTap(p,J[33],J[34],0.045,0.04);if(h<r.x)r=vec2(h,4.0);
  vec3 hd=J[34];vec3 bu=normalize(J[34]-J[33]);float b=sTap(p,hd-J[36]*0.06,hd+J[36]*0.44-bu*0.06,0.07,0.012);b=min(b,sTap(p,hd+J[36]*0.02,hd-J[36]*0.32-bu*0.05,0.065,0.014));
  b=min(b,sEll(p-hd,vec3(0.085)));if(b<r.x)r=vec2(b,5.0);}
 for(int i=0;i<6;i++){if(deb[i].w>0.0){float s=length(p-deb[i].xyz)-deb[i].w;if(s<r.x)r=vec2(s,7.0);}}
 return r;}
vec3 bump(vec3 p,vec3 n,float f,float k){float e=0.012;float b0=vnoise(p*f);vec3 g=vec3(vnoise((p+vec3(e,0,0))*f)-b0,vnoise((p+vec3(0,e,0))*f)-b0,vnoise((p+vec3(0,0,e))*f)-b0)/e;g-=n*dot(g,n);return normalize(n-k*g);}
float mapd(vec3 p){return body(p).x;}
vec3 nrm(vec3 p){vec2 e=vec2(0.0015,-0.0015);return normalize(e.xyy*mapd(p+e.xyy)+e.yyx*mapd(p+e.yyx)+e.yxy*mapd(p+e.yxy)+e.xxx*mapd(p+e.xxx));}
float ao(vec3 p,vec3 n){float o=0.0,s=1.0;for(int i=1;i<6;i++){float h=0.02+0.07*float(i);o+=(h-mapd(p+n*h))*s;s*=0.72;}return clamp(1.0-2.2*o,0.0,1.0);}
float shadow(vec3 ro,vec3 rd){float r=1.0,t=0.03;for(int i=0;i<40;i++){float h=mapd(ro+rd*t);r=min(r,10.0*h/t);t+=clamp(h,0.02,0.2);if(r<0.005||t>3.5)break;}return clamp(r,0.0,1.0);}
vec3 lin(vec3 c){return pow(c,vec3(2.2));}
void main(){
 vec2 uv=(gl_FragCoord.xy-0.5*res)/res.y;vec3 rd=normalize(camM*vec3(uv,fl));vec3 ro=cam;
 vec3 L=normalize(vec3(-0.62,0.75,0.55)),kc=vec3(1.0,0.9,0.78)*1.5;
 // 床
 vec3 col=lin(bgc)*(1.0-0.35*length(uv));float tf=rd.y<0.0?-ro.y/rd.y:1e9;
 // 体の当たり
 vec3 bc=J[0]+vec3(0.0,0.45,0.0);float t=0.0,hit=0.0;vec3 oc=ro-bc;float bb=dot(oc,rd),cc=dot(oc,oc)-2.2*2.2,disc=bb*bb-cc;
 if(disc>0.0){t=max(0.0,-bb-sqrt(disc));for(int i=0;i<110;i++){float h=mapd(ro+rd*t);if(h<0.0007*t){hit=1.0;break;}t+=h*0.9;if(t>40.0)break;}}
 if(clr>0.5&&(hit<0.5||t>tf)){gl_FragColor=vec4(0.0);return;}
 if(hit<0.5||t>tf){if(tf<1e8){vec3 p=ro+rd*tf;float fn=fbm(p*vec3(3.0,1.0,3.0));vec3 fc=lin(bgc*1.25)*(0.8+0.35*fn);
   float sh=shadow(p+vec3(0,0.001,0),L);float a=clamp(mapd(p+vec3(0,0.18,0))/0.18,0.0,1.0);a=0.45+0.55*a;
   vec3 l=vec3(0.30,0.27,0.25)*a+kc*0.32*sh*a;col=fc*l;float fade=exp(-0.06*tf*tf);col=mix(lin(bgc)*(1.0-0.35*length(uv)),col,clamp(fade*1.4,0.0,1.0));}
 }else{
  vec3 p=ro+rd*t;vec3 n=nrm(p);vec2 bm=body(p);float m=bm.y;if(m<1.5)n=bump(p-J[0],n,7.0,0.022);else if(m<3.5&&m>2.5)n=bump(TR*(p-J[0])*vec3(1.0,3.0,1.0),n,9.0,0.03);vec3 c;float sp=0.08,gl=8.0;
  vec3 hp=HR*(p-J[2]);
  if(m<1.5){vec3 lp=p-J[0];float f1=fbm(lp*5.0),f2=fbm(lp*13.0+7.0);c=lin(skin)*(0.82+0.32*f1)*(0.93+0.12*f2);
   c=mix(c,c*vec3(0.78,0.9,0.62),smoothstep(0.55,0.75,fbm(lp*2.4+3.0))*0.6);       // 濃いまだら
   if(hasFace>0.5&&length(hp*vec3(1.0,1.0,1.0))<0.62&&abs(hp.x)<0.45){vec3 hn=HR*n;float fz=smoothstep(0.05,0.3,hn.z);
    vec2 fu=hasFace>1.5?vec2(hp.x/0.84+0.5,0.5-(hp.y-0.0)/0.86):vec2(hp.x/0.74+0.5,0.5-(hp.y-0.06)/0.68);if(fu.x>0.0&&fu.x<1.0&&fu.y>0.0&&fu.y<1.0){vec4 tx=texture2D(face,fu);float a=tx.a*fz;
     c=mix(c,lin(tx.rgb),a);float glow=a*step(0.9,tx.r)*step(tx.b,0.45)*step(0.3,tx.g);if(glow>0.0){c+=lin(tx.rgb)*glow*1.6;}
     if(a>0.5){float lum=dot(tx.rgb,vec3(0.3,0.59,0.11));if(lum<0.18)sp=0.0;}}}}
  else if(m<2.5){c=lin(vec3(0.92,0.86,0.70))*(0.9+0.15*fbm(p*20.0));sp=0.15;}
  else if(m<3.5){vec3 lp=TR*(p-J[0]);c=lin(cloth)*(0.72+0.4*fbm(vec3(lp.x*9.0,lp.y*30.0,lp.z*9.0)))*(0.85+0.2*fbm(lp*20.0));sp=0.02;}
  else if(m<4.5){c=lin(vec3(0.42,0.26,0.13))*(0.8+0.3*fbm(p*vec3(25.0,4.0,25.0)));sp=0.1;}
  else if(m<5.5){c=lin(vec3(0.5,0.53,0.58))*(0.8+0.3*fbm(p*18.0));sp=0.55;gl=30.0;
   if(tool<1.5){float k=dot(p-J[34],normalize(J[35]-J[34]))/length(J[35]-J[34]);float bl=step(0.76,k)*step(0.4,fbm(p*14.0));c=mix(c,lin(vec3(0.62,0.06,0.06)),bl*0.9);}}
  else {c=lin(vec3(0.42,0.36,0.30))*(0.8+0.4*fbm(p*30.0));}
  float occ=ao(p,n);float sh=shadow(p+n*0.004,L);
  float dif=clamp(dot(n,L),0.0,1.0);float wrap=clamp((dot(n,L)+0.35)/1.35,0.0,1.0);
  vec3 sky=vec3(0.36,0.33,0.31),gnd=vec3(0.13,0.09,0.07);vec3 amb=mix(gnd,sky,n.y*0.5+0.5)*0.62;
  vec3 Fl=normalize(vec3(0.8,0.15,0.4));vec3 fill=vec3(0.32,0.36,0.45)*0.55*clamp(dot(n,Fl)*0.5+0.5,0.0,1.0);
  vec3 V=-rd;float rim=pow(1.0-clamp(dot(n,V),0.0,1.0),3.0)*clamp(dot(n,normalize(vec3(0.3,0.6,-0.8)))*0.5+0.6,0.0,1.0);
  vec3 H=normalize(L+V);float spec=pow(clamp(dot(n,H),0.0,1.0),gl)*sp;
  vec3 lig=kc*mix(wrap*0.35,dif,0.7)*sh+amb*occ+fill*occ;
  // 光が薄くもれる（粘土のやわらかさ）
  if(m<1.5)lig+=vec3(0.5,0.38,0.12)*0.18*clamp(dot(-n,L)*0.5+0.5,0.0,1.0)*occ;
  col=c*lig+vec3(0.55,0.48,0.40)*rim*0.55*occ+kc*spec*sh;
 }
 col=col/(1.0+col*0.15);col=pow(col,vec3(1.0/2.2));

    { id: "stake", name: "木人（打ちこみ台）", g: "train", txt: T.slice(1, 4).join("\n"), foot: [[2.54, -4.43, 0.7]] },
    { id: "rocks", name: "岩の山", g: "train", txt: T[4], foot: [[6.8, -3.9, 1.0]] },
    { id: "ring", name: "訓練の円（石の輪）", g: "train", txt: T[5], foot: [] },
    { id: "pit1", name: "たき火（訓練所）", g: "train", txt: "FIREPIT(0.0,-2.45)", light: "LIGHT(0.0,0.75,-2.45,1.0,0.55,0.22,4.2)", foot: [[0, -2.45, 0.8]] },
    { id: "ore", name: "採掘の岩（3つ）", g: "mine", txt: M.slice(1, 4).join("\n"), foot: [[-4.7, -3.2, 1.1], [4.2, -3.9, 1.1], [6.3, 0.6, 1.1]], ore: [[-4.7, -3.2], [4.2, -3.9], [6.3, 0.6]] },
    { id: "rail", name: "線路とトロッコ", g: "mine", txt: M.slice(4, 9).join("\n"), foot: [[0, -0.4, 0.9], [0, -3.5, 0.6], [0, 1.5, 0.6]] },
    { id: "pebble", name: "鉱石のかけら", g: "mine", txt: M[9], foot: [] },
    { id: "pick", name: "つるはし立て", g: "mine", txt: M[10], foot: [[-2.25, -4.9, 0.5]] },
    { id: "lamp", name: "ランタンの柱", g: "mine", txt: M.slice(11, 13).join("\n"), light: "LIGHT(-0.85,1.22,0.9,1.0,0.66,0.32,3.0)", foot: [[-1.2, 0.9, 0.5]] },
    { id: "bed", name: "寝わら（5つ）", g: "sleep", txt: S.slice(1, 4).join("\n"), foot: [[-4.6, -2.3, 1.0], [-1.9, -3.5, 1.0], [2.4, -3.4, 1.0], [4.9, -1.3, 1.0], [-5.0, 1.6, 1.0]],
      beds: [[-4.6, -2.3], [-1.9, -3.5], [2.4, -3.4], [4.9, -1.3], [-5.0, 1.6]] },
    { id: "pot", name: "たき火と鍋（寝床）", g: "sleep", txt: "FIREPIT(0.0,-0.9)\n" + S.slice(5, 9).join("\n"), light: "LIGHT(0.0,0.6,-0.9,1.0,0.55,0.22,3.6)", foot: [[0, -0.9, 0.9]] },
    { id: "crate", name: "木箱とランタン", g: "crate", txt: "CRATES", light: "LANTERNL", foot: [[-1.8, -4.2, 0.8], [-3.2, 3.55, 0.6]] },
    { id: "gate", name: "入口の門（奥の壁）", g: "none", txt: GATE25(0, -9.4, 0), light: "LIGHT(0.0,2.4,-8.4,1.0,0.6,0.3,2.2)", foot: [[0, -9.2, 1.8]] },
    { id: "gate2", name: "出口の門（右の壁）", g: "none", txt: GATE25(18.4, 0, 1), light: "LIGHT(17.2,2.4,0.0,1.0,0.6,0.3,2.0)", foot: [[18.0, 0, 1.6]] },
    { id: "dummy", name: "わら人形", shell: 1, foot: [[-2.05 * 6.34, 0.55 * 5.76, 0.8]] },
    { id: "rack", name: "武器立て", shell: 1, foot: [[-1.35 * 6.34, -1.65 * 5.76, 0.8]] },
    { id: "torch", name: "壁の松明", shell: 1, foot: [] },
    { id: "stal", name: "石筍と岩", shell: 1, foot: [] }];
  const off = m => m.g === "none" ? [0, 0] : G[m.g] || [0, 0];
  const wrap = (m) => { const [dx, dz] = off(m); return ` {vec3 P1=p;p=p-vec3(${dx.toFixed(2)},0.0,${dz.toFixed(2)});\n${m.txt}\n p=P1;}`; };
  const lightOf = m => { const [dx, dz] = off(m); if (m.light === "LANTERNL") return `LIGHT(${(-3.2 + dx).toFixed(2)},0.75,${(3.55 + dz).toFixed(2)},1.0,0.7,0.35,1.6)`;
    return m.light.replace(/LIGHT\(([^,]+),([^,]+),([^,]+),/, (q, x, y, z) => `LIGHT(${(+x + dx).toFixed(2)},${y},${(+z + dz).toFixed(2)},`); };
  // 選んだ施設から部屋を作る（名前は中身ごとに変える）
  function room(on){ const key = "c_" + MODS.filter(m => on[m.id]).map(m => m.id).join("_");
    if (!ROOMS24[key]) { const ms = MODS.filter(m => on[m.id] && !m.shell);
      ROOMS24[key] = { props: "\n" + ms.map(wrap).join("\n"), lights: ms.filter(m => m.light).map(lightOf).join(" "), keepDummy: !!on.dummy, noRack: !on.rack, noTorch: !on.torch, noStal: !on.stal }; }
    return key; }
  // 施設の場所（ぶつからないように）
  function foots(on){ const F = [];
    MODS.forEach(m => { if (!on[m.id]) return; const [dx, dz] = off(m); m.foot.forEach(([x, z, r]) => F.push([x + dx, z + dz, r])); });
    if (on.rail) { const [dx, dz] = off(MODS.find(m => m.id === "rail")); for (let z = -6; z <= 2.2; z += 1) F.push([dx, z + dz, 0.6]); }
    if (on.ring) { const [dx, dz] = off(MODS.find(m => m.id === "ring")); }
    return F; }
  const BIP = k => ["goblin", "skeleton", "imp", "kobold", "orc", "golem", "human", "demon", "gobx", "lich", "noble"].includes(kitOf24(k));
  const footR = c => { const B = SPBOUND24[kitOf24(c.sp)]; return Math.max(0.45, B[1] * sclOf24(c) * 0.62); };
  const inCave = (x, z) => (x / 18.5) ** 2 + ((z - 0.3) / 10.2) ** 2 < 1 && z > -9.6;
  // 魔物の並べ方：list=[{sp,evo,n,act}]
  function place(on, list, seed = 1){
    let rnd = seed; const R = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;
    const F = foots(on), cast = [], taken = [];
    const free = (x, z, r) => inCave(x, z) && F.every(([fx, fz, fr]) => Math.hypot(x - fx, z - fz) > fr + r * 0.8) && taken.every(([tx, tz, tr]) => Math.hypot(x - tx, z - tz) > (tr + r) * 0.9);
    const ores = []; MODS.forEach(m => { if (on[m.id] && m.ore) { const [dx, dz] = off(m); m.ore.forEach(([x, z]) => ores.push([x + dx, z + dz])); } });
    const beds = []; MODS.forEach(m => { if (on[m.id] && m.beds) { const [dx, dz] = off(m); m.beds.forEach(([x, z]) => beds.push([x + dx, z + dz])); } });
    let oi = 0, bi = 0, k = 0;
    // 大きい子から置く
    const all = []; list.forEach(e => { for (let i = 0; i < e.n; i++) all.push({ sp: e.sp, evo: e.evo, act: e.act }); });
    all.sort((a, b) => footR(b) - footR(a));
    all.forEach(e => { const c = { sp: e.sp, evo: e.evo, mode: "idle", t: (k++) * 0.37, r: 0, lie: false }; const r = footR(c); const bip = BIP(e.sp);
      let pos = null;
      if (e.act === "mine" && bip && ores.length && oi < ores.length * 2) { const o = ores[oi % ores.length], side = oi >= ores.length ? -1 : 1; oi++;
        const rr = Math.atan2(-(o[0]), -(o[1] - 0.0)) * 0 + (side > 0 ? 0.6 : -2.5); const ps = placeMine24([o[0], 0, o[1]], rr); c.mode = "mine"; c.r = rr; pos = [ps[0], ps[2]]; }
      else if (e.act === "sleep" && bip && beds.length && bi < beds.length) { const b = beds[bi++]; c.mode = "sleep"; c.lie = true; c.r = 1.2; pos = [b[0] + 0.2, b[1]]; }
      if (!pos) { for (let tries = 0; tries < 400 && !pos; tries++) { const x = (R() * 2 - 1) * 17.5, z = -8.8 + R() * 18; if (free(x, z, r)) pos = [x, z]; } }
      if (!pos) return;
      taken.push([pos[0], pos[1], r]);
      if (!c.lie && c.mode !== "mine") { c.r = Math.atan2(-pos[0], 6 - pos[1]) + (R() - 0.5) * 0.9;
        c.mode = e.act === "train" && bip ? (R() < 0.5 ? "slash" : "lift") : e.act === "walk" ? (bip ? "walk" : "idle") : e.act === "sleep" ? "sleep" : "idle"; }
      c.o = [pos[0], 0, pos[1]]; cast.push(c); });
    return cast; }
  return { MODS, room, place, footR };
})();

// ================= 配置ためし：施設を選び、魔物を並べて3D洞窟で見る =================
(() => {
const cv = document.getElementById("cv"), info = document.getElementById("info");
const ACTS = [["idle", "待機"], ["train", "訓練"], ["mine", "採掘"], ["sleep", "寝る"], ["walk", "歩く"]];
const KEY = "haichi25";
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
const allOn = () => Object.fromEntries(HAI25.MODS.map(m => [m.id, true]));
if (!S || !S.on || !S.list) S = { on: allOn(), list: [{ sp: "goblin", evo: 0, n: 6, act: "train" }, { sp: "orc", evo: 0, n: 2, act: "idle" }, { sp: "dragon", evo: 2, n: 1, act: "idle" }], seed: 1 };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const C = Cave3D24(cv, info, { vk: 1, onInfo: (st, w, h, z) => { info.textContent = `${st.fps.toFixed(1)} コマ/秒　魔物${window.__CN || 0}体・寄せ${z.toFixed(1)}倍`; } });

// 施設
const fac = document.getElementById("fac");
HAI25.MODS.forEach(m => { const b = document.createElement("button"); b.textContent = m.name; b.classList.toggle("on", !!S.on[m.id]);
  b.onclick = () => { S.on[m.id] = !S.on[m.id]; b.classList.toggle("on", !!S.on[m.id]); save(); dirty(); }; fac.appendChild(b); });
// 魔物の一覧
const mons = document.getElementById("mons");
const spOpts = Object.entries(NAMES25).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
function drawList(){ mons.innerHTML = "";
  S.list.forEach((e, i) => { const d = document.createElement("div"); d.className = "mon";
    d.innerHTML = `<select class="sp">${spOpts}</select><select class="ev"><option value="0">1段目</option><option value="1">2段目</option><option value="2">3段目</option></select>`
      + `<select class="ac">${ACTS.map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>`
      + `<span class="cnt"><button class="m">−</button><b>${e.n}</b><button class="p">＋</button></span><button class="x">×</button>`;
    const q = s => d.querySelector(s); q(".sp").value = e.sp; q(".ev").value = e.evo; q(".ac").value = e.act;
    q(".sp").onchange = ev => { e.sp = ev.target.value; save(); dirty(); }; q(".ev").onchange = ev => { e.evo = +ev.target.value; save(); dirty(); };
    q(".ac").onchange = ev => { e.act = ev.target.value; save(); dirty(); };
    q(".m").onclick = () => { e.n = Math.max(1, e.n - 1); save(); drawList(); dirty(); }; q(".p").onclick = () => { e.n = Math.min(12, e.n + 1); save(); drawList(); dirty(); };
    q(".x").onclick = () => { S.list.splice(i, 1); save(); drawList(); dirty(); };
    mons.appendChild(d); });
  const tot = S.list.reduce((a, e) => a + e.n, 0); document.getElementById("tot").textContent = `合計 ${tot}体（40体まで）`; }
document.getElementById("add").onclick = () => { S.list.push({ sp: "goblin", evo: 0, n: 1, act: "idle" }); save(); drawList(); dirty(); };
// プリセット
const PRE = {
  train: { on: ["stake", "rocks", "ring", "pit1", "crate", "dummy", "rack", "torch", "stal"], list: [{ sp: "goblin", evo: 0, n: 6, act: "train" }, { sp: "orc", evo: 1, n: 2, act: "train" }, { sp: "kobold", evo: 0, n: 2, act: "idle" }] },
  mine: { on: ["ore", "rail", "pebble", "pick", "lamp", "crate", "torch", "stal"], list: [{ sp: "goblin", evo: 0, n: 4, act: "mine" }, { sp: "minerorc", evo: 0, n: 2, act: "mine" }, { sp: "golem", evo: 1, n: 1, act: "idle" }] },
  sleep: { on: ["bed", "pot", "crate", "torch", "stal"], list: [{ sp: "goblin", evo: 0, n: 4, act: "sleep" }, { sp: "slime", evo: 0, n: 2, act: "sleep" }, { sp: "bat", evo: 0, n: 2, act: "idle" }] },
  all: { on: HAI25.MODS.map(m => m.id), list: [{ sp: "goblin", evo: 0, n: 4, act: "train" }, { sp: "goblin", evo: 0, n: 3, act: "mine" }, { sp: "goblin", evo: 0, n: 3, act: "sleep" }, { sp: "vampire", evo: 1, n: 1, act: "idle" }, { sp: "gargoyle", evo: 2, n: 1, act: "idle" }] },
  big: { on: ["torch", "stal"], list: [{ sp: "dragon", evo: 2, n: 3, act: "idle" }, { sp: "maou", evo: 2, n: 2, act: "idle" }, { sp: "elderdragon", evo: 2, n: 2, act: "idle" }, { sp: "underlord", evo: 2, n: 1, act: "idle" }, { sp: "goblin", evo: 0, n: 3, act: "train" }] },

document.getElementById("zin").onclick = () => C.zoomBy(1.25); document.getElementById("zout").onclick = () => C.zoomBy(0.8);
document.getElementById("zall").onclick = () => C.zoomBy(0.01);
